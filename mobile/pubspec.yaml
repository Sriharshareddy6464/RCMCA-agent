name: rcmca_mobile
description: Citizen road hazard reporting and safer route navigation for Hyderabad.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.3.2
  camera: ^0.12.2
  geolocator: ^14.1.2
  http: ^1.4.0
  http_parser: ^4.1.2
  maplibre_gl: ^0.27.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
